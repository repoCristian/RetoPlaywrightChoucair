# Nombre que verás en la pestaña Actions de GitHub
name: Playwright BDD

# Ejecutar al subir cambios o al abrir un pull request hacia main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bdd:
    # Ejecutar en una máquina Ubuntu de GitHub
    runs-on: ubuntu-latest

    steps:
      # Descargar el repositorio
      - name: Obtener el código
        uses: actions/checkout@v4

      # Instalar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Instalar las dependencias definidas en package.json/package-lock.json
      - name: Instalar dependencias
        run: npm ci

      # Instalar los navegadores de Playwright y dependencias de Linux
      - name: Instalar navegadores
        run: npx playwright install --with-deps

      # Ejecutar tu script existente:
      # cucumber-js --require-module ts-node/register
      # --require ./tests/step_definitions/*.ts ./tests/features
      - name: Ejecutar escenarios BDD
        run: npm run bdd
